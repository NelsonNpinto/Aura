[project]
name = "aura-api"
version = "0.1.0"
description = "AURA — Auditable, Unified, Reliable Agents: finance-operations API"
requires-python = ">=3.12,<3.14"
# Versions checked on PyPI 2026-11-04. Reason for each dependency:
dependencies = [
  "fastapi>=0.162,<0.163",              # HTTP API (§B2)
  "pydantic>=2.14,<3",                 # validation with explicit bounds (§B5)
  "pydantic-settings>=2.16,<3",        # env config
  "sqlalchemy[asyncio]>=2.1,<2.2",     # ORM/Core (0.3)
  "psycopg[binary,pool]>=3.3,<3.4",    # Postgres driver; also used by LangGraph checkpointer
  "alembic>=1.20,<2",                  # migrations (0.3)
  "pgvector>=0.5,<0.6",                # vector column type (0.6)
  "structlog>=26.1",                   # JSON logs with request IDs (0.3)
  "httpx>=0.28,<1",                    # outbound HTTP (Turnstile, JWKS, Blob)
  "pyjwt[crypto]>=2.15,<3",            # JWT verification via JWKS (0.4)
  "argon2-cffi>=25.1",                 # API-key hashing (§B11)
  "litellm>=1.108,<1.109",             # model router transport (§B10)
  "pyyaml>=6",                         # tasks.yaml, tools.yaml
  "upstash-redis>=1.9,<2",             # Upstash REST client (0.8)
  "langfuse>=5.1,<6",                  # tracing export (0.7)
  "fastembed>=0.9,<0.10",              # ONNX embeddings + cross-encoder rerank, no torch (0.6)
  # PDF text extraction (0.6)
  "python-multipart>=0.0.20",          # file uploads
  "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "mcp>=1.20,<2",
  "pypdfium2>=5,<6",
]

[project.scripts]
aura-eval = "app.evaluation.cli:main"

[dependency-groups]
dev = [
  "uvicorn[standard]>=0.38",           # local ASGI server only; Vercel runs the ASGI app itself
  "pytest>=9.2",
  "pytest-asyncio>=1.2",
  "ruff>=0.17.3",
  "mypy>=2.4",
  "types-pyyaml",
  "fpdf2>=2.8",
  "erp-mock",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101", "RUF012", "B008", "E501", "SIM905"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["db: needs Postgres (DATABASE_URL)", "redis: needs Upstash-compatible REST Redis"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.uv]
# litellm (all releases as of 2026-11-05) caps filelock <4, but filelock 3.x has 13 open CVEs
# (fixed in 4.2.1). litellm only imports filelock in its proxy CLI, which AURA never runs;
# huggingface-hub uses the stable FileLock API. Drop this once litellm lifts the cap.
override-dependencies = ["filelock>=4.2.1"]

[tool.uv.sources]
erp-mock = { path = "../../services/erp-mock", editable = true }
