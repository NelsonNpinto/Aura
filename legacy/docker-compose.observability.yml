# Optional local observability stack. Adapted from the upstream Langfuse v4 Compose topology.
services:
  langfuse-db:
    image: postgres:17-alpine
    profiles: [observability]
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LF_DATABASE_PASSWORD:?Run python3 scripts/configure-local.py --observability}
    volumes: [langfuse_db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U langfuse -d langfuse]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  langfuse-redis:
    image: redis:7-alpine
    profiles: [observability]
    command: [redis-server, --requirepass, '${LF_REDIS_PASSWORD}', --maxmemory-policy, noeviction]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${LF_REDIS_PASSWORD:?Configure local secrets}
    volumes: [langfuse_redis:/data]
    restart: unless-stopped
  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:26.3.62.3
    profiles: [observability]
    user: '101:101'
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LF_CLICKHOUSE_PASSWORD:?Configure local secrets}
    volumes:
      - langfuse_clickhouse:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: [CMD-SHELL, 'wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  langfuse-minio:
    image: cgr.dev/chainguard/minio
    profiles: [observability]
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: aura
      MINIO_ROOT_PASSWORD: ${LF_STORAGE_PASSWORD:?Configure local secrets}
    ports: ['127.0.0.1:19090:9000']
    volumes: [langfuse_storage:/data]
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    profiles: [observability]
    depends_on: &lf-dependencies
      langfuse-db: {condition: service_healthy}
      langfuse-redis: {condition: service_healthy}
      langfuse-clickhouse: {condition: service_healthy}
      langfuse-minio: {condition: service_healthy}
    environment: &lf-environment
      NEXTAUTH_URL: http://localhost:3300
      DATABASE_URL: postgresql://langfuse:${LF_DATABASE_PASSWORD}@langfuse-db:5432/langfuse
      SALT: ${LF_SALT:?Configure local secrets}
      ENCRYPTION_KEY: ${LF_ENCRYPTION_KEY:?Configure local secrets}
      TELEMETRY_ENABLED: 'false'
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LF_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: 'false'
      REDIS_HOST: langfuse-redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${LF_REDIS_PASSWORD}
      REDIS_TLS_ENABLED: 'false'
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: aura
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LF_STORAGE_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: 'true'
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: aura
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LF_STORAGE_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:19090
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: 'true'
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
    restart: unless-stopped
  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    profiles: [observability]
    depends_on: *lf-dependencies
    ports: ['127.0.0.1:3300:3000']
    environment:
      <<: *lf-environment
      HOSTNAME: 0.0.0.0
      NEXTAUTH_SECRET: ${LF_NEXTAUTH_SECRET:?Configure local secrets}
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_INIT_ORG_ID: aura-local
      LANGFUSE_INIT_ORG_NAME: AURA Local
      LANGFUSE_INIT_PROJECT_ID: aura-local-project
      LANGFUSE_INIT_PROJECT_NAME: AURA
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: developer@aura.local
      LANGFUSE_INIT_USER_NAME: Local developer
      LANGFUSE_INIT_USER_PASSWORD: ${LF_ADMIN_PASSWORD:?Configure local secrets}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/api/public/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s
    restart: unless-stopped
  otel:
    image: otel/opentelemetry-collector:0.139.0
    profiles: [observability]
    command: ['--config=/etc/otelcol/config.yaml']
    volumes: ['./infra/otel-collector.yml:/etc/otelcol/config.yaml:ro']
    restart: unless-stopped
volumes:
  langfuse_db:
  langfuse_redis:
  langfuse_clickhouse:
  langfuse_clickhouse_logs:
  langfuse_storage:
