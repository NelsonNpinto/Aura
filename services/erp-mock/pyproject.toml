[project]
name = "erp-mock"
version = "0.1.0"
description = "AURA mock ERP: owns schema erp, exposes REST + a stateless MCP server (synthetic data only)"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.162,<0.163",
  "sqlalchemy[asyncio]>=2.1,<2.2",
  "psycopg[binary]>=3.3,<3.4",
  "mcp>=1.30,<2",
  "pydantic>=2.14,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["erp_mock"]

[tool.vercel]
entrypoint = "erp_mock.app:app"
