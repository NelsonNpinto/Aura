repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(apps/api|services|evals)/
      - id: ruff-format
        files: ^(apps/api|services|evals)/
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: web-lint
        name: web lint
        entry: npm --prefix apps/web run lint
        language: system
        files: ^apps/web/
        pass_filenames: false
