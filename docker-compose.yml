# Local development dependencies. Production uses Neon, Upstash and AuraDB (see .env.example).
name: aura-dev

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: aura-local-only
      POSTGRES_DB: aura
    ports: ["127.0.0.1:5434:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura -d aura"]
      interval: 3s
      retries: 20

  redis:
    image: redis:8.6.8
    ports: ["127.0.0.1:6380:6379"]

  # Upstash-compatible REST facade over local Redis, so the same client runs locally and in prod.
  redis-http:
    image: hiett/serverless-redis-http:0.0.10
    environment:
      SRH_MODE: env
      SRH_TOKEN: local-upstash-token
      SRH_CONNECTION_STRING: redis://redis:6379
    ports: ["127.0.0.1:8079:80"]
    depends_on: [redis]

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/aura-local-only
      NEO4J_server_memory_heap_max__size: 512m
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    volumes: [neo4jdata:/data]
    profiles: [graph]

  ollama:
    image: ollama/ollama:latest
    ports: ["127.0.0.1:11435:11434"]
    volumes: [ollama:/root/.ollama]
    profiles: [ollama]

volumes:
  pgdata:
  neo4jdata:
  ollama:
