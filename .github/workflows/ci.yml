name: ci

# Pushes to main are tested by deploy.yml, which calls this workflow before migrating.
on:
  pull_request:
  workflow_call:
    inputs:
      live-marketing-gate:
        type: boolean
        default: false
      live-finance-gate:
        type: boolean
        default: false
    secrets:
      GROQ_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: false

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name under workflow_call, so deploy's copy never shares
  # (and cancels) a group with a standalone CI run.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-trixie
        env:
          POSTGRES_USER: aura
          POSTGRES_PASSWORD: aura-ci-only
          POSTGRES_DB: aura
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aura" --health-interval 3s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://aura:aura-ci-only@localhost:5432/aura
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install auth migration dependencies
        working-directory: apps/web
        run: npm ci
      - name: Prepare real auth schema for account integration tests
        working-directory: apps/web
        run: npm run auth:migrate
        env:
          BETTER_AUTH_SECRET: ci-auth-migrations-only-placeholder-secret
      - name: Lint and types
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy app
      - name: Migration round-trip (upgrade → check → downgrade → upgrade)
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
      - run: uv run python -m app.scripts.seed
      - name: Verify Purchasing demo account provisioning
        working-directory: apps/web
        run: npm exec -- tsx scripts/check-purchasing-demo.ts
        env:
          BETTER_AUTH_SECRET: ci-auth-migrations-only-placeholder-secret
      - run: uv run pytest -q
      - name: Deterministic invoice workflow gate
        run: uv run aura-eval run --dataset demo --gate --output /tmp/aura-workflow-report.json
        env:
          ERP_SERVICE_TOKEN: ci-erp-only
          APPROVAL_TOKEN_SECRET: ci-approval-only
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: invoice-workflow-evaluation
          path: /tmp/aura-workflow-report.json
      - name: Finance Copilot fixture gate
        run: uv run aura-eval run --dataset finance_copilot --gate --output /tmp/aura-finance-fixture.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: finance-copilot-fixture
          path: /tmp/aura-finance-fixture.json
      - name: Live Finance Copilot gate
        if: inputs.live-finance-gate
        env:
          GROQ_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.GROQ_API_KEY || '' }}
          GEMINI_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.GEMINI_API_KEY || '' }}
        run: >-
          uv run aura-eval run --dataset finance_copilot --live --gate --delay 16
          --output /tmp/aura-finance-live.json
      - uses: actions/upload-artifact@v6
        if: always() && inputs.live-finance-gate
        with:
          name: finance-copilot-live
          path: /tmp/aura-finance-live.json
      - name: Marketing judge fixture gate
        run: uv run aura-eval run --dataset marketing --gate --output /tmp/aura-marketing-fixture.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: marketing-judge-fixture
          path: /tmp/aura-marketing-fixture.json
      - name: Human-reviewed live marketing gate
        if: inputs.live-marketing-gate
        env:
          GROQ_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.GROQ_API_KEY || '' }}
          GEMINI_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.GEMINI_API_KEY || '' }}
        run: >-
          uv run aura-eval run --dataset marketing --live --gate
          --labels ../../evals/datasets/marketing/v1/human-labels.json
          --output /tmp/aura-marketing-live.json
      - uses: actions/upload-artifact@v6
        if: always() && inputs.live-marketing-gate
        with:
          name: marketing-judge-live
          path: /tmp/aura-marketing-live.json
      - uses: actions/cache@v6
        with:
          path: apps/api/model_cache
          key: fastembed-${{ hashFiles('apps/api/app/core/config.py') }}
      - name: Download bundled models
        run: uv run --no-dev python -m app.scripts.fetch_models
      - name: Bundle-size gate (< 450 MB, no torch)
        working-directory: .
        run: bash scripts/api_bundle_size.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          BETTER_AUTH_SECRET: ci-build-only-placeholder-secret-0000
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Python dependency audit
        working-directory: apps/api
        run: |
          uv export --no-dev --frozen --no-hashes --no-emit-project -o /tmp/req.txt
          uvx pip-audit -r /tmp/req.txt --strict --no-deps --disable-pip  # pinned by uv.lock; pip must not re-resolve (filelock override)
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npm audit (high+)
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
