# Nightly live evaluation on a rotating subset (§B13 CI tiers).
#
# Throttled to the free-tier quotas: one rotating slice per night, a delay between cases, and the
# eval budget reserved in the governor so a demo visitor is never starved by CI.
# A regression against the stored baseline opens a GitHub issue; nothing is auto-promoted.
name: nightly-evals

on:
  schedule:
    - cron: "17 5 * * *" # 05:17 UTC — off-peak for the demo
  workflow_dispatch:
    inputs:
      limit:
        description: Cases to run
        default: "50"

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-evals
  cancel-in-progress: false

jobs:
  evals:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ERP_SERVICE_TOKEN: ${{ secrets.ERP_SERVICE_TOKEN }}
      APPROVAL_TOKEN_SECRET: ${{ secrets.APPROVAL_TOKEN_SECRET }}
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen

      # Rotate the slice by day of year so the whole golden set is covered over a week.
      - name: Pick tonight's slice
        id: slice
        run: echo "offset=$(( $(date +%j) % 4 ))" >> "$GITHUB_OUTPUT"

      - name: Workflow eval (live, throttled)
        run: >-
          uv run aura-eval run --dataset golden_invoices --live --gate
          --limit ${{ github.event.inputs.limit || 50 }} --delay 16
          --output /tmp/nightly-workflow.json
        continue-on-error: true

      - name: Copilot trajectories (live, throttled)
        run: >-
          uv run aura-eval run --dataset copilot_tasks --live --gate --limit 20 --delay 16
          --output /tmp/nightly-trajectory.json
        continue-on-error: true

      - name: Drift report
        run: uv run python -m app.scripts.nightly --drift --memory-decay --graph-sync
        continue-on-error: true

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: nightly-evals
          path: /tmp/nightly-*.json

      - name: Open an issue on regression
        if: failure() || steps.slice.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const title = `Nightly eval regression ${new Date().toISOString().slice(0,10)}`;
            const body = [
              'The nightly live evaluation did not pass its gate.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Artifacts hold the full per-case report. Nothing was promoted or published.',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'eval-regression',
            });
            if (!existing.data.some(i => i.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['eval-regression'],
              });
            }
