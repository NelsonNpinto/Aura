[project]
name = "aura-api"
version = "0.1.0"
description = "AURA reliability and evaluation API"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.8,<3", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2", "httpx>=0.28,<1", "jsonschema>=4.23,<5", "pgvector>=0.4,<1", "python-multipart>=0.0.20,<1", "pypdf>=6,<7", "rank-bm25>=0.2.2,<1", "langgraph>=1,<2", "langchain-ollama>=1,<2", "langchain-text-splitters>=1,<2", "opentelemetry-sdk>=1.38,<2", "opentelemetry-exporter-otlp-proto-http>=1.38,<2", "langfuse>=4,<5"]

[project.optional-dependencies]
rag = ["torch>=2.6,<3", "sentence-transformers>=5,<6", "ragas>=0.3,<0.4", "langchain-huggingface>=1,<2", "langchain-community>=0.3.31,<0.4"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
