# Gitleaks configuration. Extends the bundled default ruleset; this file only adds
# allowlist entries for known false positives. Never add an allowlist for a real secret —
# rotate it instead.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
description = "Generic API key (default rule, narrowed below)"
regex = '''(?i)(?:key|api[_.-]?key|token|secret|password)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\||:|<=|=>|:=|\?=)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;]|$)'''
keywords = ["key", "api", "token", "secret", "password"]

  [rules.allowlist]
  description = """
  TypeScript comparisons of a variable literally named `key` against a metric name read as
  `key = "<value>"` by the generic rule. These are metric identifiers rendered on the public
  eval report, not credentials.
  """
  regexTarget = "line"
  regexes = [
    '''key === "(?:p95_latency_ms|cost_microusd_per_case|extraction_f1|judge_agreement|pass_rate)"''',
  ]
  paths = [
    '''apps/web/src/app/eval-report/page\.tsx''',
  ]
